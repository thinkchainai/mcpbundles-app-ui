[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpbundles-app-ui"
version = "0.8.1"
description = "Python library for building MCP App UIs — declarative components, themes, and MCP protocol client. Define an app in Python, get self-contained HTML."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "MCPBundles", email = "hello@mcpbundles.com" },
]
keywords = ["mcp", "model-context-protocol", "ui", "app", "dashboard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/thinkchainai/mcpbundles-app-ui"
Repository = "https://github.com/thinkchainai/mcpbundles-app-ui"
Documentation = "https://github.com/thinkchainai/mcpbundles-app-ui#readme"
"Hosted Version" = "https://mcpbundles.com"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpbundles_app_ui"]
